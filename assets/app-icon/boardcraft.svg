<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BoardCraft app icon (draft): a heron standing in a storyboard frame.
       Three colours: Ink #0b0b0c, Paper #f2f1ee, BoardCraft orange #e26842. Original work. -->
  <defs>
    <clipPath id="tile"><rect x="6" y="6" width="500" height="500" rx="106"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0b0c"/>
  <g clip-path="url(#tile)">
    <rect x="6" y="6" width="500" height="500" fill="#f2f1ee"/>
    <!-- storyboard frame -->
    <rect x="78" y="108" width="356" height="236" rx="10" fill="none" stroke="#0b0b0c" stroke-width="14"/>
    <!-- horizon and water -->
    <path d="M92 282 C150 270 200 296 256 282 S360 270 420 284" fill="none" stroke="#e26842" stroke-width="10" stroke-linecap="round"/>
    <!-- heron: body, neck, head, beak, legs -->
    <path d="M214 250 C206 214 232 190 268 196 C300 202 314 230 300 252 C286 270 238 272 214 250 Z" fill="#0b0b0c"/>
    <path d="M262 198 C252 172 256 150 276 140" fill="none" stroke="#0b0b0c" stroke-width="12" stroke-linecap="round"/>
    <circle cx="282" cy="138" r="13" fill="#0b0b0c"/>
    <path d="M292 134 L340 126 L294 146 Z" fill="#0b0b0c"/>
    <circle cx="284" cy="135" r="3.5" fill="#f2f1ee"/>
    <path d="M250 264 L244 318 M266 264 L274 318" stroke="#0b0b0c" stroke-width="7" stroke-linecap="round"/>
    <!-- panel strip below -->
    <rect x="78" y="374" width="104" height="58" rx="6" fill="#e26842"/>
    <rect x="204" y="374" width="104" height="58" rx="6" fill="#0b0b0c"/>
    <rect x="330" y="374" width="104" height="58" rx="6" fill="#e26842"/>
  </g>
</svg>
