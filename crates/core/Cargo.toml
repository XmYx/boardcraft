[package]
name = "boardcraft-core"
description = "BoardCraft document model: scenes, panels, drawings, camera moves, the .boardcraft format, Fountain import and timeline export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-atomic = { workspace = true }
craft-ai-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
craft-image-codecs = { workspace = true }
craft-zip = { workspace = true }
craft-timeline = { workspace = true }
craft-xml = { workspace = true }
craft-pdf = { workspace = true }
skrifa = { workspace = true }
# The audio track (decode, waveform overview, AAC for movies) and movie export (H.264 in MP4).
craft-audio = { workspace = true }
craft-media = { workspace = true }
craft-video = { workspace = true }

[dev-dependencies]
# A real font for the board-sheet tests.
epaint_default_fonts = { workspace = true }
# Decode exported movies back in the tests.
craft-video = { workspace = true, features = ["h264-decode"] }
